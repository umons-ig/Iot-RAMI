services:
  node-backend:
    container_name: ${NODE_CONTAINER_NAME}
    image: iot-rami-backend-local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_ENV=${NODE_ENV}
        - DB_USER=${DB_USER}
        - DB_PASSWORD=${DB_PASSWORD}
        - DB_NAME=${DB_NAME}
        - DB_HOST=${DB_CONTAINER_NAME}
        - DB_DIALECT=${DB_DIALECT}
        - NODE_PORT_IN=${NODE_PORT_IN}
        - KAFKA_BROKERS=${KAFKA_BROKERS}
    restart: always
    ports:
      - ${NODE_PORT_OUT}:${NODE_PORT_IN}
    environment:
      - NODE_ENV=${NODE_ENV}
      - NODE_PORT=${NODE_PORT_IN}
      - NODE_HOST=${NODE_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_CONTAINER_NAME}
      - DB_PORT=${DB_PORT_IN}
      - DB_DIALECT=${DB_DIALECT}
      - JWT_SECRET=${JWT_SECRET}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
      - BCRYPT_SALT_ROUNDS=${BCRYPT_SALT_ROUNDS}
      - KAFKA_BROKERS=${KAFKA_BROKERS}
      # Sécurité Kafka optionnelle (défaut PLAINTEXT local) — voir .env.example
      - KAFKA_SSL=${KAFKA_SSL:-}
      - KAFKA_SASL_MECHANISM=${KAFKA_SASL_MECHANISM:-}
      - KAFKA_SASL_USERNAME=${KAFKA_SASL_USERNAME:-}
      - KAFKA_SASL_PASSWORD=${KAFKA_SASL_PASSWORD:-}
    networks:
      - default
    depends_on:
      - node-db
  node-db:
    container_name: ${DB_CONTAINER_NAME}
    image: timescale/timescaledb:latest-pg${DB_VERSION}
    restart: always
    ports:
      - ${DB_PORT_OUT}:${DB_PORT_IN}
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data
    # TIMESCALE DB INITIALIZATION
    entrypoint: ["/bin/bash", "-c", "echo \"shared_preload_libraries = 'timescaledb'\" >> /var/lib/postgresql/data/postgresql.conf && docker-entrypoint.sh postgres"]
    networks:
      - default

  # Kafka en mode KRaft (sans Zookeeper), aligné sur le docker-compose.yml racine.
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092,CONTROLLER://kafka:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - default
  prometheus:
    image: prom/prometheus:latest
    container_name: rami-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - node-backend
    networks:
      - default

  grafana:
    image: grafana/grafana:latest
    container_name: rami-grafana
    restart: always
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
    depends_on:
      - prometheus
    networks:
      - default

volumes:
  db-data:
    name: db-data-${NODE_ENV}
  grafana-data:

networks:
  default:
    name: network-${NODE_ENV}



