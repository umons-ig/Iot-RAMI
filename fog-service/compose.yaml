services:
  fog-service:
    image: ghcr.io/gaspardmenou/iot-rami-fog:latest
    restart: unless-stopped
    mem_limit: 512m
    environment:
      - MQTT_URL=mqtt://mosquitto
      - MQTT_PORT=1883
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - KAFKA_BROKERS=${KAFKA_BROKERS}
      # Outbox store-and-forward (Postgres local)
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=${PG_USER:-fog}
      - PG_PASSWORD=${PG_PASSWORD:-fog}
      - PG_DATABASE=${PG_DATABASE:-fog_outbox}
    depends_on:
      mosquitto:
        condition: service_started
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    container_name: fog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-fog}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-fog}
      POSTGRES_DB: ${PG_DATABASE:-fog_outbox}
    volumes:
      - fog-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    restart: always
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    ports:
      - "1883:1883"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -u $$MQTT_USERNAME -P $$MQTT_PASSWORD -t '$$SYS/#' -C 1 -W 3 || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
  watchtower:
    # Fork communautaire maintenu (containrrr/watchtower archivé en déc. 2025).
    # API-compatible : même config, même comportement. Multi-arch (amd64/arm64).
    image: nickfedor/watchtower:1.18.1
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_POLL_INTERVAL=300
      - DOCKER_API_VERSION=1.44
      - WATCHTOWER_CLEANUP=true
volumes:
  fog-db-data: