; Firmware RAMI unifié, config-driven (cf. docs/FIRMWARE_ARCHITECTURE.md).
;
; UN seul code. On choisit le(s) capteur(s) AU FLASH en sélectionnant
; l'environnement :  pio run -e dht22_bmp280 -t upload
; Les pins/adresses se surchargent via build_flags ; le WiFi/MQTT se configure
; sur le portail captif au premier démarrage.
;
; Ajouter un capteur : créer src/drivers/<X>Driver.{hpp,cpp} (#ifdef ENABLE_<X>),
; un bloc #ifdef dans main.cpp, et un env ci-dessous.

[platformio]
default_envs = dht22

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; ~3 Mo pour l'app : le binaire « universel » (tous drivers) tient large.
board_build.partitions = huge_app.csv
lib_ldf_mode = deep+
lib_deps =
    ; Socle commun (ISensor, SensorRunner, CompositeSensor, MQTT/WiFi/NTP)
    symlink://../Common
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.0
    tzapu/WiFiManager@^2.0.17
    arduino-libraries/NTPClient@^3.2.1
    ; Librairies des drivers (LDF ne lie que celles réellement #incluses)
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit BMP280 Library@^2.6.8
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit BusIO@^1.17.4
    WiFiClientSecure

; ─── Sélections (un env = un jeu de capteurs au flash) ───────────────────────
[env:dht22]
build_flags = -D ENABLE_DHT22 -D DHT22_PIN=27

[env:bmp280]
build_flags = -D ENABLE_BMP280 -D BMP280_ADDR=0x76

[env:dht22_bmp280]
build_flags =
    -D ENABLE_DHT22 -D DHT22_PIN=27
    -D ENABLE_BMP280 -D BMP280_ADDR=0x76

[env:ad8232]
; ECG : intervalle d'échantillonnage court (100 Hz). Le vrai haute fréquence
; (250-500 Hz via tâche FreeRTOS) est une évolution ultérieure.
build_flags = -D ENABLE_AD8232 -D SAMPLE_INTERVAL_MS=10

[env:hcsr04]
build_flags = -D ENABLE_HCSR04 -D HCSR04_TRIG_PIN=22 -D HCSR04_ECHO_PIN=23

; Radar mmWave : nécessite la lib Seeed (ajoutée uniquement pour cet env).
[env:mr60bha2]
build_flags = -D ENABLE_MR60BHA2
lib_deps =
    ${env.lib_deps}
    https://github.com/Love4yzp/Seeed-mmWave-library.git

; Exemple multi-capteurs sur un même ESP32 (environnement d'ambiance).
[env:dht22_bmp280_hcsr04]
build_flags =
    -D ENABLE_DHT22 -D DHT22_PIN=27
    -D ENABLE_BMP280 -D BMP280_ADDR=0x76
    -D ENABLE_HCSR04
